    <script>
      // Prevents "flash of unstyled content" by applying the theme before React loads.
      (function() {
        const theme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        // Use dark mode if theme is 'dark', or if theme is not 'light' (i.e. 'system' or unset) and the OS prefers dark.
        const isDark = theme === 'dark' || (theme !== 'light' && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // This configures Tailwind CSS to use the 'class' strategy for dark mode.

      tailwind.config = {

    </script>
